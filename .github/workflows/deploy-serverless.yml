name: Deploy Serverless (manual)

# IMPORTANT: This workflow is MANUAL-ONLY (workflow_dispatch).
# It does NOT auto-trigger on push to main — the legacy deploy-prod.yml still handles
# the EC2 path on push to main. Run this manually when you want to deploy the CDK stacks.
#
# Prerequisites before running:
#   1. The secret `life-dashboard/app` in Secrets Manager must be populated out-of-band.
#      See docs/deploy-serverless.md Step 3 for the full key list.
#   2. CDK bootstrap must have been run once for the account/region:
#         cd infra && npx cdk bootstrap --qualifier lifedash aws://ACCOUNT_ID/us-east-1
#   3. The IAM role referenced by AWS_DEPLOY_ROLE_ARN must trust this workflow's OIDC provider.
#
# After a successful deploy, run the DB migrate Fargate task manually (Step 5 in the runbook)
# and update the OAuth redirect URIs in the secret (Step 7).

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

concurrency:
  group: deploy-serverless
  cancel-in-progress: false  # don't cancel in-flight CDK deploys; they can leave stacks in UPDATE_IN_PROGRESS

jobs:
  deploy:
    name: CDK deploy (all stacks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install CDK Python dependencies
        working-directory: infra
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Install CDK CLI (project-local)
        working-directory: infra
        run: npm ci

      - name: Build frontend (VITE_API_BASE_URL must be empty for same-origin routing)
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL= npm run build
        # The built dist/ is picked up by EdgeStack's BucketDeployment for S3 upload.
        # VITE_API_BASE_URL must be empty: the Axios client prepends /api already,
        # so an empty base → same-origin /api/* (CloudFront /api/* behavior).

      - name: CDK deploy — all stacks
        working-directory: infra
        run: |
          source .venv/bin/activate
          npx cdk deploy --all --require-approval never
        # Deploys in CDK dependency order:
        #   LifeDash-Foundation (S3, DynamoDB, SQS, ECR image push, Secrets Manager)
        #   LifeDash-Compute    (Lambda functions, API Gateway HTTP API, EventBridge, SQS event source)
        #   LifeDash-Edge       (CloudFront, BucketDeployment → S3 + CF invalidation)
        #   LifeDash-DataJobs   (ECS Fargate migrate task definition)
        #
        # NOTE: The secret `life-dashboard/app` must be populated before this deploy
        # (or at least before Lambda cold-start). The Foundation stack creates an empty
        # secret; populate it manually per docs/deploy-serverless.md Step 3.

      - name: Print CloudFront URL
        run: |
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name LifeDash-Edge \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionUrl'].OutputValue" \
            --output text 2>/dev/null || echo "(not available yet)")
          echo "CloudFront URL: ${CF_URL}"
          echo ""
          echo "NEXT MANUAL STEPS (see docs/deploy-serverless.md):"
          echo "  Step 5: Run DB migrate Fargate task"
          echo "  Step 7: Update FRONTEND_URL + OAuth redirect URIs in the secret to: ${CF_URL}"
          echo "  Step 7: Update Google Cloud Console authorized redirect URIs"
          echo "  Step 8: Verify: curl ${CF_URL}/health"
        # The DB migrate task (Step 5) requires the secret to be populated and must be
        # run manually after this workflow completes. It cannot safely be automated here
        # because it runs against the production database and is idempotent-but-careful.
