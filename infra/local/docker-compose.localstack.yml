name: life-dashboard-local

networks:
  default:
    name: life-dashboard-local_default

services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: lambda,apigateway,sqs,s3,events,secretsmanager,dynamodb,cloudformation,iam,sts,logs,ecr,ssm
      DEBUG: "0"
      LAMBDA_RUNTIME_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      LAMBDA_DOCKER_NETWORK: life-dashboard-local_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack

  appdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life
      POSTGRES_DB: life_dashboard
    ports:
      - "55432:5432"
    volumes:
      - appdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  localstack_data:
  appdb_data:
